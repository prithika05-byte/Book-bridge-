
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a Book - BookBridge</title>
<style>
body {
    margin: 0;
    padding: 35px;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 85% 15%, #fffde8 0 35px, transparent 37px),
        radial-gradient(circle at 20% 25%, white 1px, transparent 2px),
        radial-gradient(circle at 60% 15%, white 1px, transparent 3px),
        linear-gradient(180deg, #0b3c70, #087fa4, #56c6c2);
    background-attachment: fixed;
}
.box {
    max-width: 480px;
    margin: 50px auto;
    padding: 28px;
    border-radius: 18px;
    background: #07365bd9;
    border: 1px solid #8be8ff80;
}
input {
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    margin: 12px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    background: #16b8d0;
    color: white;
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="box">
    <h1>Find a Book</h1>
    <form id="requestForm">
        <input id="title" placeholder="Book title" required>
        <input id="donor" placeholder="Donor name" required>
        <input id="student" placeholder="Your name" required>
        <button type="submit">Request Book</button>
    </form>
    <p><a href="donor-requests.html" style="color:white">
        Donor Requests Page
    </a></p>
</div>

<script src="workflow.js"></script>
<script>
document.getElementById("requestForm").addEventListener("submit", e => {
    e.preventDefault();

    createRequest(
        document.getElementById("title").value.trim(),
        document.getElementById("donor").value.trim(),
        document.getElementById("student").value.trim()
    );

    e.target.reset();
});
</script>
</body>
</html>
